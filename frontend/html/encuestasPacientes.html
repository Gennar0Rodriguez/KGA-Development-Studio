<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encuestas Públicas | SIGSM</title>

    <link rel="icon" href="../logo/hospital de clinicaslogo.png">
    <link rel="stylesheet" href="../css/stylesencuestasPaciente.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <img src="../logo/hospital de clinicaslogo.png" alt="Logo del Hospital">
        <h1>Encuestas Públicas</h1>
    </header>

    <hr>

    <div class="layout">

        <aside class="sidebar">

            <nav>

                <a href="documentacionPublica.html">
                    <i class="fa-solid fa-file-medical"></i>
                    Documentación
                </a>

                <a href="encuestasPacientes.html" class="active">
                    <i class="fa-solid fa-clipboard-question"></i>
                    Encuestas
                </a>

            </nav>

            <div class="usuario">
                <img src="../img/invitado.png" alt="Usuario invitado">

                <div>
                    <strong>Invitado</strong>
                    <p>Hospital de Clínicas</p>
                </div>
            </div>

        </aside>

        <main>

            <div class="titulo">

                <h2>Ayúdenos a mejorar</h2>

                <p>
                    Su opinión nos ayuda a mejorar nuestros servicios.
                    La encuesta es anónima.
                </p>

            </div>

            <form class="encuesta-card" id="formEncuesta">

                <div class="seleccion-categoria">

                    <label for="categoriaEncuesta">
                        Seleccione una categoría
                    </label>

                    <select id="categoriaEncuesta" required>
                        <option value="">Cargando categorías...</option>
                    </select>

                </div>

                <div id="tituloEncuesta"></div>

                <div id="listaPreguntas">

                    <p>Seleccione una categoría para comenzar.</p>

                </div>

                <p id="mensajeEncuesta" role="status"></p>

                <button type="submit" class="btn-enviar">

                    <i class="fa-solid fa-paper-plane"></i>
                    Enviar Encuesta

                </button>

            </form>

        </main>

    </div>

    <script src="../js/logout.js"></script>
    <script src="../js/encuestasPacientes.js"></script>

</body>

</html>
