<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Traslado | SIGSM</title>
    <link rel="stylesheet" href="../css/stylesgestionAmbulancias.css">
    <link rel="stylesheet" href="../css/stylesnuevoTraslado.css">
    <link rel="stylesheet" href="../css/stylesnotificaciones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
    <body>
        <header>
            <img src="../logo/hospital de clinicaslogo.png" alt="Logo de SIGSM">
            <h1>Administración de ambulancias</h1>
        </header>

    <hr>

        <div class="layout">
            <div id="sidebar"></div>

        <main>

            <section class="formulario-traslado">

                <h2>Nuevo Traslado</h2>

                <form>
                    <label for="ambulancia">Matricula de la ambulancia</label>    
                    <select id="ambulancia" required>
                        <option>Seleccione una ambulancia</option>
                        <option>ABC-123</option>
                        <option>DEF-456</option>
                        <option>GHI-789</option>
                    </select>
                    

                    <label for="paciente" >Paciente</label>
                    <input type="text" id="paciente" required>

                    <label for="conductor">Conductor</label>
                    <select id="conductor">
                        <option>Seleccione un conductor</option>
                        <option>Juan Pérez</option>
                        <option>Ana García</option>
                    </select>

                    <label for="enfermero">Enfermero</label>
                    <select id="enfermero" required>
                        <option>Seleccione un enfermero</option>
                        <option>María López</option>
                        <option>Carlos Rodríguez</option>
                    </select>

                    <label for="destino">Destino</label>
                    <input type="text" id="destino" required>

                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>

                    <label for="hora">Hora de salida</label>
                    <input type="time" id="hora" required>

                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" required></textarea>

                    <label for="estado">Estado</label>
                    <select id="estado" required>
                        <option>Programado</option>
                        <option>En curso</option>
                        <option>Finalizado</option>
                    </select>

                    <label for="oxigeno">Necesita Oxigeno</label>
                    <select id="oxigeno" required>
                        <option>No</option>
                        <option>Si</option>
                    </select>

                    <label for="camilla">Tipo de Camilla</label>
                    <select id="camilla" required>
                        <option>Emergencia</option>
                        <option>Comun</option>
                    </select>
                    
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad" required>
                        <option>Normal</option>
                        <option>Urgente</option>
                        <option>Crítica</option>
                    </select>

                </form>

                <div class="acciones-formulario">
                <button type="submit" class="btn-guardar" onclick="window.location.href='gestionAmbulancias.html'">Guardar</button>
                <button type="button" class="btn-cancelar" onclick="window.location.href='gestionAmbulancias.html'">Cancelar</button>
                </div>

            </section>

        </main>
        
        </div>
        <script src="../js/logout.js"></script>
        <script src="../js/sesionNav.js"></script>
        <script src="../js/componentes.js"></script>
        
    </body>
</html>
