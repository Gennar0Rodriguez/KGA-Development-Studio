<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | SIGSM</title>
    <link rel="icon" href="../logo/hospital de clinicaslogo.png">
    <link rel="stylesheet" href="../css/stylesIndex.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <img src="../logo/logowhite.png" alt="Logo de SIGSM">
        <h1 class="login-title">Inicia sesión en el sistema</h1>
    </header>

    <main>
        <section class="login-container">
            <p>Por favor, ingresa tus credenciales para acceder a tu cuenta.</p>
            
            <form id="formLogin">
                <label for="ci_admin">Cédula:</label>
                <input type="text" id="ci_admin" name="ci_admin" required placeholder="Ej: 12345678">

                <label for="pass">Contraseña:</label>
                <input type="password" id="pass" name="pass" required placeholder="*********">

                <button type="submit">
                    Iniciar sesión
                </button>
            </form>
        </section>

        <section class="notAdmin-container">
            <p>¿No eres un administrador?</p>

            <section class="invitado-container">
                <a href="../html/documentacionPublica.html">Ingresa como invitado aquí</a>
            </section>
        </section>
    </main>
    
    <script src="../js/login.js"></script>
</body>
</html>
