<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Ambulancias | SIGSM</title>
    <link rel="stylesheet" href="../css/stylesgestionAmbulancias.css">
    <link rel="stylesheet" href="../css/stylesnotificaciones.css">
    <link rel="stylesheet" href="../css/stylesdocumentosAdmin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
    <body>
        <header>
            <img src="../logo/hospital de clinicaslogo.png" alt="Logo de SIGSM">
            <h1>Administración de Documentos</h1>
        </header>

        <hr>

    <div class="layout">

<aside class="sidebar">
    <div class="logo">
        <h2>Hospital De Clinicas</h2>
    </div>
    
    <nav>
        <a href="gestionAmbulancias.html">
            <i class="fa-solid fa-truck-medical"></i> Ambulancias
        </a>

        <a href="documentosAdmin.html" id="navDocumentos" class="active">
            <i class="fa-solid fa-file-lines"></i> Documentación
        </a>

        <a href="notificaciones.html">
            <i class="fa-solid fa-bell"></i> Notificaciones <span class="badge">3</span>
        </a>

        <a href="administrarUsuarios.html" id="navUsuarios">
            <i class="fa-solid fa-user-plus"></i> Administrar Usuarios
        </a>
    </nav>

    <div class="usuario">
        <img src="../img/fotoejemplo.webp" alt="Usuario">
        <div>
            <strong id="lblRolUsuario">Cargando...</strong>
            <p id="lblNombreUsuario">Hospital de Clínicas</p>
        </div>
    </div>
        <button id="btnLogout" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
</aside>
    
    <main>

    <section class="documentos-container">

        <h2>Administración de Documentación</h2>
        <a href="subirDocumento.html">
            <button class="btn-subir">
                + Subir documento
            </button>
        </a>
    <section class="busqueda-documentos">
        <input type="text" class="buscador" placeholder="Buscar documento...">
        <button class="btn-buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
    </section>
        <table class="tabla-documentos">

            <thead>
                <tr>
                    <th>Documento</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>GuiaPacientes.pdf</td>
                    <td>15/06/2026</td>
                    <td>
                        <button class="btn-eliminar-doc">Eliminar</button>
                    </td>
                </tr>

            </tbody>

        </table>

    </section>

    </main>
    <script src="../js/logout.js"></script>
    <script src="../js/sesionNav.js"></script>
</body>
</html>
