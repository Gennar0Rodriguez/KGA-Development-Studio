<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Ambulancias | SIGSM</title>
    <link rel="icon" href="../logo/hospital de clinicaslogo.png">
    <link rel="stylesheet" href="../css/stylesgestionAmbulancias.css">
    <link rel="stylesheet" href="../css/stylesnotificaciones.css">
    <link rel="stylesheet" href="../css/modalNuevoTraslado.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
</head>
<body data-titulo="Gestión de Ambulancias">
    <div id="header"></div>
    <hr>

    <div class="layout">
        <div id="sidebar"></div>

        <main>
    <section class="btn-principal">

        <!-- Abre el formulario para registrar un traslado -->
        <button type="button" class="btn-agregar" id="btnAbrirModalTraslado">
            <i class="fa-solid fa-plus"></i> Añadir un traslado
        </button>

        <!-- Abre el formulario para registrar un vehículo -->
        <button type="button" class="btn-agregar" id="btnAbrirModalAmbulancia">
            <i class="fa-solid fa-ambulance"></i> Añadir una ambulancia
        </button>

        <input type="text" class="buscador" placeholder="Buscar por matrícula...">

        <button class="btn-buscar">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

    </section>

            <section class="seccion-vehiculos">
                <h2>Vehículos registrados</h2>
                <!-- Este contenedor se completa desde gestionAmbulancias.js -->
                <div class="contenedor-vehiculos" id="contenedorVehiculos"></div>
            </section>

            <section class="seccion-traslados">
                <h2>Traslados registrados</h2>
                <!-- modalNuevoTraslado.js utiliza este contenedor -->
                <div class="contenedor-ambulancias"></div>
            </section>
        </main>

    <div id="modalNuevoTraslado" class="modal-traslado">

        <div class="modal-traslado-contenido">

            <div class="modal-traslado-header">

                <h2>Nuevo Traslado</h2>

                <button
                    type="button"
                    id="btnCerrarModalTraslado"
                    class="btn-cerrar-traslado">
                    &times;
                </button>

            </div>


            <form id="formNuevoTraslado">

                <label for="ambulancia">
                    Matrícula de la ambulancia
                </label>

                <select id="ambulancia" required>
                    <option value="">Seleccione una ambulancia</option>
                    <option value="ABC-123">ABC-123</option>
                    <option value="DEF-456">DEF-456</option>
                    <option value="GHI-789">GHI-789</option>
                </select>


                <label for="paciente">
                    Paciente
                </label>

                <input
                    type="text"
                    id="paciente"
                    required
                >


                <label for="conductor">
                    Conductor
                </label>

                <select id="conductor">

                    <option value="">
                        Seleccione un conductor
                    </option>

                    <option value="Juan Pérez">
                        Juan Pérez
                    </option>

                    <option value="Ana García">
                        Ana García
                    </option>

                </select>


                <label for="enfermero">
                    Enfermero
                </label>

                <select id="enfermero" required>

                    <option value="">
                        Seleccione un enfermero
                    </option>

                    <option value="María López">
                        María López
                    </option>

                    <option value="Carlos Rodríguez">
                        Carlos Rodríguez
                    </option>

                </select>


                <label for="destino">
                    Destino
                </label>

                <input
                    type="text"
                    id="destino"
                    required
                >


                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha"
                    required
                >


                <label for="hora">
                    Hora de salida
                </label>

                <input
                    type="time"
                    id="hora"
                    required
                >


                <label for="observaciones">
                    Observaciones
                </label>

                <textarea
                    id="observaciones"
                    required
                ></textarea>


                <label for="estado">
                    Estado
                </label>

                <select id="estado" required>

                    <option value="Programado">
                        Programado
                    </option>

                    <option value="En curso">
                        En curso
                    </option>

                    <option value="Finalizado">
                        Finalizado
                    </option>

                </select>


                <label for="oxigeno">
                    Necesita Oxígeno
                </label>

                <select id="oxigeno" required>

                    <option value="No">
                        No
                    </option>

                    <option value="Si">
                        Sí
                    </option>

                </select>


                <label for="camilla">
                    Tipo de Camilla
                </label>

                <select id="camilla" required>

                    <option value="Emergencia">
                        Emergencia
                    </option>

                    <option value="Comun">
                        Común
                    </option>

                </select>


                <label for="prioridad">
                    Prioridad
                </label>

                <select id="prioridad" required>

                    <option value="Normal">
                        Normal
                    </option>

                    <option value="Urgente">
                        Urgente
                    </option>

                    <option value="Crítica">
                        Crítica
                    </option>

                </select>


                <div class="acciones-formulario">

                    <button
                        type="button"
                        id="btnCancelarModalTraslado"
                        class="btn-cancelar">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-guardar">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>
        <!-- Modal para registrar un vehículo nuevo -->
    <div id="modalNuevaAmbulancia" class="modal-traslado">
        <div class="modal-traslado-contenido">
            <div class="modal-traslado-header">
                <h2>Añadir una ambulancia</h2>
                <button type="button" id="btnCerrarModalAmbulancia" class="btn-cerrar-traslado">&times;</button>
            </div>

            <form id="formNuevaAmbulancia">
                <label for="matriculaVehiculo">Matrícula</label>
                <input
                    type="text"
                    id="matriculaVehiculo"
                    name="matricula"
                    maxlength="15"
                    placeholder="Ej: SCA1234"
                    required
                >

                <label for="modeloVehiculo">Modelo</label>
                <input
                    type="text"
                    id="modeloVehiculo"
                    name="modelo"
                    maxlength="50"
                    placeholder="Ej: Mercedes Sprinter"
                    required
                >

                <label for="capacidadVehiculo">Capacidad</label>
                <input
                    type="number"
                    id="capacidadVehiculo"
                    name="capacidad"
                    min="1"
                    step="1"
                    placeholder="Cantidad de personas"
                    required
                >

                <label for="tipoVehiculo">Tipo de vehículo</label>
                <select id="tipoVehiculo" name="tipo_vehiculo" required>
                    <option value="">Seleccione un tipo</option>
                    <option value="ambulancia">Ambulancia</option>
                    <option value="auto">Auto</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="camillaVehiculo">¿Dispone de camilla?</label>
                <select id="camillaVehiculo" name="camilla" required>
                    <option value="">Seleccione una opción</option>
                    <option value="1">Sí</option>
                    <option value="0">No</option>
                </select>

                <p id="mensajeAmbulancia" role="status" aria-live="polite"></p>

                <div class="acciones-formulario">
                    <button type="button" id="btnCancelarModalAmbulancia" class="btn-cancelar">
                        Cancelar
                    </button>
                    <button type="submit" id="btnGuardarAmbulancia" class="btn-guardar">
                        Guardar vehículo
                    </button>
                </div>
            </form>
        </div>
    </div>

    </div>

    
    <script src="../js/modalNuevoTraslado.js"></script>
    <script src="../js/gestionAmbulancias.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/sidebarEmpleado.js"></script>
    <script src="../js/notificaciones.js"></script>
</body>
</html>
