services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kga_app
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - documentos-volume:/var/www/html/API/uploads/documentos

  database:
    image: mysql:8.4
    container_name: kga_db
    environment:
      MYSQL_DATABASE: Proyecto
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db-volume:/var/lib/mysql
      - ./backend/database/mer.sql:/docker-entrypoint-initdb.d/mer.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-volume:
  documentos-volume:

